name: Deploy (ECS)
on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'deploy/ecs/**'
      - '.github/workflows/deploy-ecs.yml'
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "239460481239"
  ECR_REPO: socket-server
  CLUSTER: mcp-agents-staging-cluster
  SERVICE: socket-server-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::239460481239:role/github-actions-deployer
      - name: ECR login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}
          docker buildx build --platform linux/amd64 -t "$IMAGE_URI" --push .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
      - name: Render & register task definition
        id: td
        run: |
          TD=$(jq --arg img "$IMAGE_URI" '.containerDefinitions[0].image = $img' deploy/ecs/task-definition.json)
          ARN=$(aws ecs register-task-definition --cli-input-json "$TD" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "td_arn=$ARN" >> $GITHUB_OUTPUT
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "${{ steps.td.outputs.td_arn }}" \
            --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
